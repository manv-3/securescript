[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securescript"
version = "1.0.0"
description = "Multi-Tenant SaaS Web Application Firewall Platform — Real-Time XSS Detection & Proxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic[email]>=2.0.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    # Auth
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    # HTTP / Alerts
    "httpx>=0.25.0",
    "aiosmtplib>=3.0.0",
    "python-slugify>=8.0.0",
    # ML / Detection
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    # Config
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["securescript*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
