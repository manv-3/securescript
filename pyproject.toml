[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securescript"
version = "0.4.0"
description = "Intelligent Real-Time Cross-Site Scripting (XSS) Detection Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["securescript*"]
