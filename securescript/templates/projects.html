<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureScript — My Projects</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Nav -->
  <nav class="border-b border-slate-800 px-6 py-4 flex items-center justify-between max-w-7xl mx-auto">
    <div class="flex items-center gap-2">
      <a href="/platform" class="flex items-center gap-2 text-white">
        <span class="text-xl">🛡️</span>
        <span class="font-bold">SecureScript</span>
      </a>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-email" class="text-sm text-slate-400"></span>
      <button onclick="logout()" class="text-sm text-slate-400 hover:text-white transition">Logout</button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-white">My Projects</h1>
        <p class="text-slate-400 text-sm mt-1">Each project is a protected website with its own proxy path.</p>
      </div>
      <a href="/app/projects/new"
        class="px-5 py-2.5 bg-sky-500 hover:bg-sky-400 text-white font-semibold rounded-lg transition shadow-lg shadow-sky-500/20">
        + Connect New Site
      </a>
    </div>

    <!-- Loading state -->
    <div id="loading" class="text-center py-20 text-slate-500">Loading your projects…</div>

    <!-- Empty state -->
    <div id="empty" class="hidden text-center py-20">
      <div class="text-5xl mb-4">🔓</div>
      <h3 class="text-xl font-semibold text-white mb-2">No projects yet</h3>
      <p class="text-slate-400 mb-6">Connect your first website to start protecting it from XSS attacks.</p>
      <a href="/app/projects/new" class="px-6 py-3 bg-sky-500 hover:bg-sky-400 text-white rounded-lg font-medium transition">
        Connect Your First Site →
      </a>
    </div>

    <!-- Projects grid -->
    <div id="projects-grid" class="hidden grid gap-4"></div>
  </main>

  <script>
    const token = localStorage.getItem('ss_token');
    if (!token) window.location.href = '/login';

    function authHeaders() {
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    function logout() {
      localStorage.removeItem('ss_token');
      window.location.href = '/login';
    }

    function statusBadge(active) {
      return active
        ? `<span class="inline-flex items-center gap-1.5 px-2 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-medium">
             <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Active
           </span>`
        : `<span class="px-2 py-1 bg-slate-700 text-slate-400 rounded-full text-xs font-medium">Inactive</span>`;
    }

    function reachabilityBadge(ok) {
      if (ok === null || ok === undefined) return `<span class="text-slate-500 text-xs">Checking…</span>`;
      return ok
        ? `<span class="text-emerald-400 text-xs">✓ Reachable</span>`
        : `<span class="text-red-400 text-xs">✗ Unreachable</span>`;
    }

    async function loadProjects() {
      try {
        const res = await fetch('/platform/projects', { headers: authHeaders() });
        if (res.status === 401) { logout(); return; }
        const projects = await res.json();

        document.getElementById('loading').classList.add('hidden');

        if (!projects.length) {
          document.getElementById('empty').classList.remove('hidden');
          return;
        }

        const grid = document.getElementById('projects-grid');
        grid.classList.remove('hidden');
        grid.innerHTML = projects.map(p => `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 hover:border-slate-600 transition">
            <div class="flex items-start justify-between mb-3">
              <div>
                <h3 class="font-semibold text-white text-lg">${escHtml(p.name)}</h3>
                <code class="text-sky-400 text-sm">${escHtml(p.proxy_path)}</code>
              </div>
              ${statusBadge(p.is_active)}
            </div>
            <div class="grid grid-cols-2 gap-2 mb-4 text-sm">
              <div>
                <span class="text-slate-500">Frontend</span>
                <div class="text-slate-300 truncate">${escHtml(p.frontend_url)}</div>
                <div class="mt-0.5">${reachabilityBadge(p.frontend_reachable)}</div>
              </div>
              <div>
                <span class="text-slate-500">Backend</span>
                <div class="text-slate-300 truncate">${escHtml(p.backend_url)}</div>
                <div class="mt-0.5">${reachabilityBadge(p.backend_reachable)}</div>
              </div>
            </div>
            <div class="flex gap-2">
              <a href="/app/projects/${p.id}"
                class="flex-1 text-center py-2 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-lg transition">
                📊 Dashboard
              </a>
              <button onclick="copyProxy('${escHtml(p.proxy_path)}')"
                class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg transition" title="Copy proxy path">
                📋 Copy Path
              </button>
            </div>
          </div>
        `).join('');

      } catch (e) {
        document.getElementById('loading').textContent = 'Error loading projects. Please refresh.';
      }
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function copyProxy(path) {
      navigator.clipboard.writeText(window.location.origin + path).then(() => alert('Proxy path copied!'));
    }

    loadProjects();
  </script>
</body>
</html>
