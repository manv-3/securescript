<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureScript — Sign Up / Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="/platform" class="inline-flex items-center gap-2 text-white">
        <span class="text-3xl">🛡️</span>
        <span class="font-bold text-xl">SecureScript</span>
      </a>
      <p class="text-slate-400 text-sm mt-2">Multi-tenant WAF Platform</p>
    </div>

    <!-- Tab switcher -->
    <div class="flex bg-slate-900 border border-slate-800 rounded-xl p-1 mb-6">
      <button id="tab-signup" onclick="switchTab('signup')"
        class="flex-1 py-2 text-sm font-medium rounded-lg bg-sky-500 text-white transition">
        Sign Up
      </button>
      <button id="tab-login" onclick="switchTab('login')"
        class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition">
        Login
      </button>
    </div>

    <!-- Sign Up Form -->
    <div id="form-signup" class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <h2 class="text-xl font-bold text-white mb-1">Create your account</h2>
      <p class="text-sm text-slate-400 mb-6">Start protecting your websites for free.</p>

      <div id="signup-error" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm"></div>
      <div id="signup-success" class="hidden mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-emerald-400 text-sm"></div>

      <form id="signup-form" onsubmit="handleSignup(event)">
        <div class="mb-4">
          <label class="block text-sm text-slate-300 mb-2">Email address</label>
          <input type="email" id="signup-email" required placeholder="you@example.com"
            class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
        </div>
        <div class="mb-6">
          <label class="block text-sm text-slate-300 mb-2">Password</label>
          <input type="password" id="signup-password" required placeholder="Min. 8 characters" minlength="8"
            class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
        </div>
        <button type="submit" id="signup-btn"
          class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-white font-semibold rounded-lg transition shadow-lg shadow-sky-500/20">
          Create Account
        </button>
      </form>
    </div>

    <!-- Login Form -->
    <div id="form-login" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <h2 class="text-xl font-bold text-white mb-1">Welcome back</h2>
      <p class="text-sm text-slate-400 mb-6">Sign in to your SecureScript account.</p>

      <div id="login-error" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-sm text-slate-300 mb-2">Email address</label>
          <input type="email" id="login-email" required placeholder="you@example.com"
            class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
        </div>
        <div class="mb-6">
          <label class="block text-sm text-slate-300 mb-2">Password</label>
          <input type="password" id="login-password" required placeholder="Your password"
            class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
        </div>
        <button type="submit" id="login-btn"
          class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-white font-semibold rounded-lg transition shadow-lg shadow-sky-500/20">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('ss_token')) {
      window.location.href = '/app/projects';
    }

    // Show login tab if URL is /login
    if (window.location.pathname === '/login') {
      switchTab('login');
    }

    function switchTab(tab) {
      const isSignup = tab === 'signup';
      document.getElementById('form-signup').classList.toggle('hidden', !isSignup);
      document.getElementById('form-login').classList.toggle('hidden', isSignup);
      document.getElementById('tab-signup').className = isSignup
        ? 'flex-1 py-2 text-sm font-medium rounded-lg bg-sky-500 text-white transition'
        : 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition';
      document.getElementById('tab-login').className = !isSignup
        ? 'flex-1 py-2 text-sm font-medium rounded-lg bg-sky-500 text-white transition'
        : 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition';
    }

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('signup-btn');
      const errEl = document.getElementById('signup-error');
      const okEl = document.getElementById('signup-success');
      btn.textContent = 'Creating account…';
      btn.disabled = true;
      errEl.classList.add('hidden');
      okEl.classList.add('hidden');

      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('signup-email').value,
            password: document.getElementById('signup-password').value,
          })
        });
        const data = await res.json();

        if (res.ok) {
          okEl.textContent = 'Account created! Signing you in…';
          okEl.classList.remove('hidden');
          // Auto login
          await loginWithCredentials(
            document.getElementById('signup-email').value,
            document.getElementById('signup-password').value
          );
        } else {
          errEl.textContent = data.detail || 'Registration failed. Please try again.';
          errEl.classList.remove('hidden');
          btn.textContent = 'Create Account';
          btn.disabled = false;
        }
      } catch {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.remove('hidden');
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      errEl.classList.add('hidden');

      const success = await loginWithCredentials(
        document.getElementById('login-email').value,
        document.getElementById('login-password').value
      );
      if (!success) {
        errEl.textContent = 'Incorrect email or password.';
        errEl.classList.remove('hidden');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    }

    async function loginWithCredentials(email, password) {
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password })
        });
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('ss_token', data.access_token);
          window.location.href = '/app/projects';
          return true;
        }
        return false;
      } catch {
        return false;
      }
    }
  </script>
</body>
</html>
